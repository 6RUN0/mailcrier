---
version: 2
updates:
  - package-ecosystem: gomod
    target-branch: develop
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: gomod
    target-branch: develop
    directories:
      - "/tools"
      - "/tools/actionlint"
      - "/tools/goreleaser"
      - "/tools/licenses"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    allow:
      - dependency-name: "github.com/golangci/golangci-lint/v2"
        dependency-type: all
      - dependency-name: "golang.org/x/vuln"
        dependency-type: all
      - dependency-name: "github.com/rhysd/actionlint"
        dependency-type: all
      - dependency-name: "github.com/goreleaser/goreleaser/v2"
        dependency-type: all
      - dependency-name: "github.com/google/go-licenses/v2"
        dependency-type: all
    groups:
      go-tools-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: pip
    target-branch: develop
    directory: "/tools"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      python-tools-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    target-branch: develop
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    target-branch: develop
    directories:
      - "/testdata/setgid-e2e"
      - "/testdata/units-verify"
      - "/packaging/smoke/debian"
      - "/packaging/smoke/rocky9"
      - "/packaging/smoke/rocky10"
      - "/packaging/smoke/alpine"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    commit-message:
      prefix: test
      include: scope
