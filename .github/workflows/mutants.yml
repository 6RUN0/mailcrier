---
name: Mutants

"on":
  schedule:
    - cron: "23 2 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: mutants
  cancel-in-progress: false

jobs:
  mutants:
    name: make mutants
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/gremlins/go.sum
      - run: make mutants
      # Also after new survivors, which the report lists with their status.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: mutants
          path: .mutants/report.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  contract:
    name: make contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - run: make contract
