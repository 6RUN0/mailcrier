## Configuration of mailcrier, see mailcrier(8). Until a target is set,
## every message is held in /var/spool/mailcrier with exit status 78.
## Examples of every target type, routes and templates:
## /usr/share/doc/mailcrier/examples/ or
## https://github.com/6RUN0/mailcrier/tree/main/packaging/examples
## Check a change with "mailcrier --check-config", send a test message
## with "mailcrier --probe". Remove "# " from the lines below to use them.
## The token goes alone into a file that only root and the group
## mailcrier read:
##   install -m 0640 -o root -g mailcrier /dev/null /etc/mailcrier.d/telegram.token
##   printf '%s\n' '123456:ABC-your-token' > /etc/mailcrier.d/telegram.token

# [target.ops-telegram]
# type = "telegram"
# token_file = "/etc/mailcrier.d/telegram.token"
# chat_id = -1001234567890
