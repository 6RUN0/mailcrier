# Templates of your own: a Go text/template in the configuration or in a
# file. Everything taken from the message goes through the escaper of the
# target markup (tgHTML for Telegram, toJson for JSON); fields and functions
# are listed in mailcrier(8). A template that fails on a message gives way
# to the built-in one.
#
# Copy this file to /etc/mailcrier.conf, then run "mailcrier --check-config",
# which renders a sample message with each template.

[target.ops-telegram]
type = "telegram"
token_file = "/etc/mailcrier.d/telegram.token"
chat_id = -1001234567890
template = '''
<b>{{ .Subject | default .Strings.NoSubject | tgHTML }}</b>
<i>{{ .Hostname | tgHTML }}</i> {{ .Date | tz "UTC" | date "2006-01-02 15:04" }} UTC
{{- range .Attachments }}
{{ .Name | tgHTML }}, {{ humanizeBytes .Size }}
{{- end }}
<pre>{{ .Body | default .Strings.EmptyBody | trimEnd | tgHTML }}</pre>'''

# /etc/mailcrier.d/api.tmpl, mode 0640, owner root, group mailcrier, holds:
#
#   {"title": {{ toJson .Subject }}, "host": {{ toJson .Hostname }},
#    "from": {{ toJson .From.Addr }}, "text": {{ toJson (.Body | head 50) }}}
[target.api]
type = "http"
url = "https://api.example.org/notify"
template_file = "/etc/mailcrier.d/api.tmpl"
