# Push notifications through ntfy (https://ntfy.sh or a server of your own).
#
# The topic URL, https://ntfy.sh/<topic>, goes alone into
# /etc/slendmail.d/ntfy.url, mode 0640, owner root, group slendmail; a
# protected topic takes user:password@ in the URL or an auth query. Copy
# this file to /etc/slendmail.conf, then run "slendmail --check-config" and
# "slendmail --probe".

[target.phone]
type = "ntfy"
url_file = "/etc/slendmail.d/ntfy.url"
# ntfy.sh takes files of at most 2 MB; a server of your own takes 15 MiB
# unless configured otherwise, then leave the key out.
max_file_size = 2000000
# The subject is the title of the notification; the text is plain, at most
# 4096 bytes: host and sender, then the body.
template = '''
{{ .Hostname }}: {{ .From.Addr }}
{{ .Body | default .Strings.EmptyBody | trimEnd }}'''
