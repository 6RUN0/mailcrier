# A container, where mailcrier runs as the user of the application without
# the setgid bit: that user reads this file and the secrets, and writes the
# spool. Mount the file as a Docker or Kubernetes secret and name it with
# MAILCRIER_CONFIG=/run/secrets/mailcrier.conf; secrets go in through *_file
# keys. For PHP: sendmail_path = /usr/sbin/sendmail -t -i, with
# env[MAILCRIER_CONFIG] = /run/secrets/mailcrier.conf in the FPM pool.
# Check it in the container with "mailcrier --check-config".

[spool]
# A volume writable by that user, so that queued messages survive a restart
# of the container; dir = "" turns the spool off.
dir = "/var/spool/mailcrier"

[target.ops-telegram]
type = "telegram"
token_file = "/run/secrets/telegram_token"
chat_id = -1001234567890
