## Reference of /etc/mailcrier.conf: every table with its default values and
## one minimal target of each type; mailcrier(8) explains each key. Lines
## with "## " explain, lines with "# " are the example: remove "# " from the
## lines you need. Secrets go alone into files under /etc/mailcrier.d, mode
## 0640, owner root, group mailcrier. Check a change with
## "mailcrier --check-config", send a test message with "mailcrier --probe".

## Time limits and the syslog tag; the values are the defaults.
# [general]
# syslog_tag = "mailcrier"
# http_timeout = "15s"
# deadline = "30s"
## "sendmail 1234567@telegram" reaches a chat of this list through the bot of
## the telegram target named here.
# telegram_direct = "telegram"
# telegram_direct_chats = [1234567, "@ops_channel"]
# telegram_direct_max = 10

## Notices in place of missing content; the values are the defaults.
# [strings]
# no_subject = "(no subject)"
# empty_body = "(empty body)"
# truncated = "[truncated]"
# truncated_size = "[truncated, %s in full]"
# more_attachments = "... and %d more"
# not_sent = "[not sent]"

## The spool, where messages wait for a target that failed; the values are
## the defaults, dir = "" turns the spool off.
# [spool]
# dir = "/var/spool/mailcrier"
# drain_budget = "10s"
# drain_max_messages = 20
# run_budget = "60s"
# queue_ttl = "168h"
# hold_ttl = "168h"
# failed_ttl = "720h"
# max_queue_messages = 1000
# max_queue_bytes = 268435456
# max_queue_messages_per_uid = 200
# max_queue_bytes_per_uid = 67108864

## Targets: each table [target.<name>] is one, the name of a-z, 0-9 and -.
## Every target gets every message unless [[route]] rules choose, see
## routes.conf.

## Telegram: the bot token from @BotFather, a chat, group or channel id.
# [target.telegram]
# type = "telegram"
# token_file = "/etc/mailcrier.d/telegram.token"
# chat_id = -1001234567890

## Slack: a bot token (xoxb-...) with chat:write and files:write.
# [target.slack]
# type = "slack"
# token_file = "/etc/mailcrier.d/slack.token"
# channel = "#alerts"

## Discord: a webhook URL, https://discord.com/api/webhooks/<id>/<token>.
# [target.discord]
# type = "discord"
# url_file = "/etc/mailcrier.d/discord.url"

## ntfy: a topic URL, https://ntfy.sh/<topic>.
# [target.ntfy]
# type = "ntfy"
# url_file = "/etc/mailcrier.d/ntfy.url"

## HTTP: a JSON request; presets mattermost, slack-webhook, generic-json, or
## a template of your own, see webhook.conf.
# [target.webhook]
# type = "http"
# url = "https://api.example.org/notify"
# preset = "generic-json"

## A program of your own with the message on stdin, see hook.conf.
# [target.hook]
# type = "exec"
# argv = ["/usr/local/bin/mailcrier-hook"]

## A service of the shoutrrr library, chosen by the URL scheme, here Gotify:
## gotify://gotify.example.org/<token>.
# [target.gotify]
# type = "shoutrrr"
# url_file = "/etc/mailcrier.d/gotify.url"
