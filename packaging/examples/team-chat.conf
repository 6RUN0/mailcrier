# Slack, Discord and Mattermost together: every message goes to all three.
#
# Each secret goes alone into its file under /etc/mailcrier.d, mode 0640,
# owner root, group mailcrier. Copy this file to /etc/mailcrier.conf, keep
# the targets you use, then run "mailcrier --check-config" and
# "mailcrier --probe".

# A Slack bot token (xoxb-...) with chat:write and files:write; the bot must
# be a member of a private channel.
[target.slack]
type = "slack"
token_file = "/etc/mailcrier.d/slack.token"
channel = "#alerts"

# A Discord webhook: https://discord.com/api/webhooks/<id>/<token>
[target.discord]
type = "discord"
url_file = "/etc/mailcrier.d/discord.url"

# A Mattermost incoming webhook: https://mattermost.example.org/hooks/<key>
[target.mattermost]
type = "http"
preset = "mattermost"
url_file = "/etc/mailcrier.d/mattermost.url"
# Optional: the name the posts show and a channel other than the one of the
# webhook.
username = "mailcrier"
channel = "alerts"
