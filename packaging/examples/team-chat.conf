# Slack, Discord and Mattermost together: every message goes to all three.
#
# Each secret goes alone into its file under /etc/slendmail.d, mode 0640,
# owner root, group slendmail. Copy this file to /etc/slendmail.conf, keep
# the targets you use, then run "slendmail --check-config" and
# "slendmail --probe".

# A Slack bot token (xoxb-...) with chat:write and files:write; the bot must
# be a member of a private channel.
[target.slack]
type = "slack"
token_file = "/etc/slendmail.d/slack.token"
channel = "#alerts"

# A Discord webhook: https://discord.com/api/webhooks/<id>/<token>
[target.discord]
type = "discord"
url_file = "/etc/slendmail.d/discord.url"

# A Mattermost incoming webhook: https://mattermost.example.org/hooks/<key>
[target.mattermost]
type = "http"
preset = "mattermost"
url_file = "/etc/slendmail.d/mattermost.url"
# Optional: the name the posts show and a channel other than the one of the
# webhook.
username = "slendmail"
channel = "alerts"
