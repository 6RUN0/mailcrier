# Several targets, each message to the ones its rules choose; Telegram chats
# named as recipients; a noisy cron job dropped.
#
# The secrets go alone into their files under /etc/slendmail.d, mode 0640,
# owner root, group slendmail. Copy this file to /etc/slendmail.conf, then
# run "slendmail --check-config" and "slendmail --probe".

[general]
# "sendmail 1234567@telegram" reaches the chat 1234567 through the bot of
# ops-telegram, but only for the chats listed here.
telegram_direct = "ops-telegram"
telegram_direct_chats = [1234567, "@ops_channel"]

[target.ops-telegram]
type = "telegram"
token_file = "/etc/slendmail.d/telegram.token"
chat_id = -1001234567890

[target.backup-team]
type = "http"
preset = "mattermost"
url_file = "/etc/slendmail.d/mattermost.url"

[target.phone]
type = "ntfy"
url_file = "/etc/slendmail.d/ntfy.url"

# Neither sent nor queued: the report of a cron job that runs every hour.
# A glob matches the whole subject, case ignored.
[[suppress]]
subject = "Cron <*> *run-parts --report /etc/cron.hourly*"

# The rules are checked from the first, for each recipient on its own; the
# first match wins, continue goes on to the next rules.

# RAID and SMART alarms go to the phone, and on to the rules below.
[[route]]
subject_regex = '(?i)\b(raid|smart|degraded)\b'
targets = ["phone"]
continue = true

# Mail to the local user backup, as cron sends it, goes to the backup team.
[[route]]
recipient = "backup"
targets = ["backup-team"]

# No condition: every other message. Without such a rule a message no rule
# matches is held and the call exits 64.
[[route]]
targets = ["ops-telegram"]
