# One Telegram chat, with a forum topic and long messages as a file.
#
# The bot token, such as 123456:REPLACE-ME from @BotFather, goes alone into
# /etc/mailcrier.d/telegram.token, mode 0640, owner root, group mailcrier.
# Copy this file to /etc/mailcrier.conf, then run "mailcrier --check-config"
# and "mailcrier --probe". Every key is explained in mailcrier(8).

[target.ops-telegram]
type = "telegram"
token_file = "/etc/mailcrier.d/telegram.token"
# A group or channel id (-100...), a user id, or "@channel" for a public one.
chat_id = -1001234567890
# Optional: the topic of a forum group; leave it out for a plain chat.
message_thread_id = 42
# Optional: a text over the limit of Telegram is cut and shows the start of
# the body in a collapsed quote; the full message goes along as message.eml.
on_long = "blockquote"
long_file = "eml"
# Optional: at most 40 lines of the body in the text, the rest in the file.
max_lines = 40
