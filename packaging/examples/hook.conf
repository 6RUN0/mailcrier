# A program of your own gets every message. It reads the message on stdin;
# SLENDMAIL_SUBJECT, SLENDMAIL_FROM, SLENDMAIL_TO, SLENDMAIL_HOSTNAME and
# the other variables of slendmail(8) carry what was decoded from it. Exit
# status 0 is a delivery, 75 a temporary failure that is retried, anything
# else a permanent failure.
#
# /usr/local/bin/slendmail-hook, mode 0755, for example:
#
#   #!/bin/sh
#   # Logs sender and subject; the message itself is on stdin.
#   logger -t slendmail-hook -- "$SLENDMAIL_FROM: $SLENDMAIL_SUBJECT"
#
# The values come from whoever wrote the message: quote them, never pass
# them to eval or sh -c. A call by a user runs the hook as that user, a
# queue run as slendmail, so argv holds no secret and the program must be
# trusted with what slendmail reads. Copy this file to /etc/slendmail.conf,
# then run "slendmail --check-config" and "slendmail --probe".

[target.run]
type = "exec"
# Run without a shell; argv[0] is an absolute path.
argv = ["/usr/local/bin/slendmail-hook"]
# Optional, the default: the process group is killed after it, and the
# message stays queued.
timeout = "30s"
