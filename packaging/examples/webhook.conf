# HTTP requests to services of your own: a JSON API that gets every message
# and a status page that is pinged with GET.
#
# Copy this file to /etc/mailcrier.conf, then run "mailcrier --check-config"
# and "mailcrier --probe".

# PUT {"subject": ..., "body": ..., "hostname": ...} with a bearer token.
[target.api]
type = "http"
url = "https://api.example.org/notify"
preset = "generic-json"
method = "PUT"

# Header values are templates. A secret goes into the text outside {{ }},
# which the log masks; never into an action, whose error is logged.
[target.api.headers]
Authorization = "Bearer REPLACE-ME"
X-Mail-Host = "{{ .Hostname }}"

# GET https://status.example.org/api/push/<host>?status=down&msg=<subject>,
# without a body; pathSegment escapes a / of the host name.
[target.ping]
type = "http"
method = "GET"
url = "https://status.example.org/api/push"
path = "/{{ pathSegment .Hostname }}"

[target.ping.query]
status = "down"
msg = "{{ .Subject | truncate 200 }}"
