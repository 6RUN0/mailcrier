## Configuration of slendmail, see slendmail(8). Until a target is set,
## every message is held in /var/spool/slendmail with exit status 78.
## Examples of every target type, routes and templates:
## /usr/share/doc/slendmail/examples/ or
## https://github.com/6RUN0/slendmail/tree/develop/packaging/examples
## Check a change with "slendmail --check-config", send a test message
## with "slendmail --probe". Remove "# " from the lines below to use them.

# [target.ops-telegram]
# type = "telegram"
# token_file = "/etc/slendmail.d/telegram.token"
# chat_id = -1001234567890
