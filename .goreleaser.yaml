---
version: 2
project_name: mailcrier

builds:
  - id: mailcrier
    main: ./cmd/mailcrier
    binary: mailcrier
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    flags:
      - -trimpath
    ldflags:
      - -s -w -buildid=
    mod_timestamp: "{{ .CommitTimestamp }}"
  - id: mailcrier-minimal
    main: ./cmd/mailcrier
    binary: mailcrier-minimal
    tags:
      - noshoutrrr
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    flags:
      - -trimpath
    ldflags:
      - -s -w -buildid=
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: mailcrier
    ids:
      - mailcrier
    formats:
      - binary
  - id: mailcrier-minimal
    ids:
      - mailcrier-minimal
    formats:
      - binary

nfpms:
  - id: mailcrier
    ids:
      - mailcrier
    formats:
      - deb
      - rpm
      - apk
    maintainer: Boris Talovikov <boris.t.66@gmail.com>
    homepage: https://github.com/6RUN0/mailcrier
    license: BSD-3-Clause
    section: mail
    description: |-
      sendmail replacement that sends mail to chat services
      Local tools such as cron, sudo, mdadm or smartd pipe a message into
      /usr/sbin/sendmail; mailcrier delivers it to Telegram, Discord, Slack,
      ntfy, an HTTP webhook, a shoutrrr service or a program of your own.
    bindir: /usr/sbin
    mtime: "{{ .CommitDate }}"
    umask: 0o022
    scripts:
      preinstall: packaging/scripts/preinstall.sh
    deb:
      predepends:
        - init-system-helpers (>= 1.54~)
        - passwd
    apk:
      scripts:
        preupgrade: packaging/scripts/preinstall.sh
        postupgrade: packaging/scripts/apk/post-upgrade.sh
    overrides:
      deb:
        provides:
          - mail-transport-agent
        conflicts:
          - mail-transport-agent
        replaces:
          - mail-transport-agent
        scripts:
          postinstall: packaging/scripts/deb/postinst.sh
          preremove: packaging/scripts/deb/prerm.sh
          postremove: packaging/scripts/deb/postrm.sh
      rpm:
        provides:
          - MTA
        dependencies:
          - /usr/sbin/useradd
          - /usr/sbin/alternatives
        scripts:
          postinstall: packaging/scripts/rpm/post.sh
          preremove: packaging/scripts/rpm/preun.sh
          postremove: packaging/scripts/rpm/postun.sh
      apk:
        scripts:
          postinstall: packaging/scripts/apk/post-install.sh
          preremove: packaging/scripts/apk/pre-deinstall.sh
          postremove: packaging/scripts/apk/post-deinstall.sh
    contents:
      - dst: /usr/sbin/sendmail
        src: mailcrier
        type: symlink
        packager: deb
        file_info:
          mode: 0o777
      - dst: /usr/lib/sendmail
        src: ../sbin/mailcrier
        type: symlink
        packager: deb
        file_info:
          mode: 0o777
      - dst: /usr/bin/mailq
        src: ../sbin/mailcrier
        type: symlink
        packager: deb
        file_info:
          mode: 0o777
      - dst: /usr/bin/newaliases
        src: ../sbin/mailcrier
        type: symlink
        packager: deb
        file_info:
          mode: 0o777
      - dst: /usr/sbin/sendmail
        src: mailcrier
        type: symlink
        packager: apk
        file_info:
          mode: 0o777
      - dst: /usr/lib/sendmail
        src: ../sbin/mailcrier
        type: symlink
        packager: apk
        file_info:
          mode: 0o777
      - dst: /usr/bin/mailq
        src: ../sbin/mailcrier
        type: symlink
        packager: apk
        file_info:
          mode: 0o777
      - dst: /usr/bin/newaliases
        src: ../sbin/mailcrier
        type: symlink
        packager: apk
        file_info:
          mode: 0o777
      - dst: /usr/sbin/sendmail
        type: ghost
        packager: rpm
      - dst: /usr/lib/sendmail
        type: ghost
        packager: rpm
      - dst: /usr/bin/mailq
        type: ghost
        packager: rpm
      - dst: /usr/bin/newaliases
        type: ghost
        packager: rpm
      - dst: /etc/mailcrier.conf
        src: packaging/mailcrier.conf
        type: config|noreplace
        file_info:
          owner: root
          group: mailcrier
          mode: 0o640
      - dst: /etc/mailcrier.d
        type: dir
        file_info:
          owner: root
          group: mailcrier
          mode: 0o750
      - dst: /var/spool/mailcrier
        type: dir
        file_info:
          owner: root
          group: mailcrier
          mode: 0o750
      - dst: /var/spool/mailcrier/tmp
        type: dir
        file_info:
          owner: root
          group: mailcrier
          mode: 0o2770
      - dst: /var/spool/mailcrier/queue
        type: dir
        file_info:
          owner: root
          group: mailcrier
          mode: 0o2770
      - dst: /var/spool/mailcrier/hold
        type: dir
        file_info:
          owner: root
          group: mailcrier
          mode: 0o2770
      - dst: /var/spool/mailcrier/failed
        type: dir
        file_info:
          owner: root
          group: mailcrier
          mode: 0o2770
      - dst: /var/spool/mailcrier/locks
        type: dir
        file_info:
          owner: root
          group: mailcrier
          mode: 0o2770
      - dst: /usr/lib/systemd/system/mailcrier-queue.service
        src: packaging/systemd/mailcrier-queue.service
        packager: deb
        file_info:
          mode: 0o644
      - dst: /usr/lib/systemd/system/mailcrier-queue.timer
        src: packaging/systemd/mailcrier-queue.timer
        packager: deb
        file_info:
          mode: 0o644
      - dst: /usr/lib/systemd/system/mailcrier-queue.service
        src: packaging/systemd/mailcrier-queue.service
        packager: rpm
        file_info:
          mode: 0o644
      - dst: /usr/lib/systemd/system/mailcrier-queue.timer
        src: packaging/systemd/mailcrier-queue.timer
        packager: rpm
        file_info:
          mode: 0o644
      - dst: /etc/cron.d/mailcrier
        src: packaging/cron/mailcrier
        type: config|noreplace
        packager: deb
        file_info:
          mode: 0o644
      - dst: /etc/cron.d/mailcrier
        src: packaging/cron/mailcrier
        type: config|noreplace
        packager: rpm
        file_info:
          mode: 0o644
      - dst: /etc/crontabs/mailcrier
        src: packaging/cron/crontabs-mailcrier
        packager: apk
        file_info:
          mode: 0o600
      - dst: /usr/share/man/man8/mailcrier.8
        src: docs/mailcrier.8
        file_info:
          mode: 0o644
      - dst: /usr/share/doc/mailcrier/examples/mailcrier.conf
        src: packaging/examples/mailcrier.conf
        file_info:
          mode: 0o644
      - dst: /usr/share/doc/mailcrier/examples/telegram.conf
        src: packaging/examples/telegram.conf
        file_info:
          mode: 0o644
      - dst: /usr/share/doc/mailcrier/examples/team-chat.conf
        src: packaging/examples/team-chat.conf
        file_info:
          mode: 0o644
      - dst: /usr/share/doc/mailcrier/examples/ntfy.conf
        src: packaging/examples/ntfy.conf
        file_info:
          mode: 0o644
      - dst: /usr/share/doc/mailcrier/examples/webhook.conf
        src: packaging/examples/webhook.conf
        file_info:
          mode: 0o644
      - dst: /usr/share/doc/mailcrier/examples/hook.conf
        src: packaging/examples/hook.conf
        file_info:
          mode: 0o644
      - dst: /usr/share/doc/mailcrier/examples/routes.conf
        src: packaging/examples/routes.conf
        file_info:
          mode: 0o644
      - dst: /usr/share/doc/mailcrier/examples/templates.conf
        src: packaging/examples/templates.conf
        file_info:
          mode: 0o644
      - dst: /usr/share/doc/mailcrier/examples/container.conf
        src: packaging/examples/container.conf
        file_info:
          mode: 0o644
      - dst: /usr/share/doc/mailcrier/copyright
        src: LICENSE
        packager: deb
        file_info:
          mode: 0o644
      - dst: /usr/share/licenses/mailcrier/LICENSE
        src: LICENSE
        type: license
        packager: rpm
        file_info:
          mode: 0o644
      - dst: /usr/share/licenses/mailcrier/LICENSE
        src: LICENSE
        packager: apk
        file_info:
          mode: 0o644

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '^(build|ci|test)\(deps(-dev)?\)!?:'
      - '^Bump '
  groups:
    - title: Features
      regexp: '^feat(\([^)]*\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\([^)]*\))?!?:'
      order: 1
    - title: Performance
      regexp: '^perf(\([^)]*\))?!?:'
      order: 2
    - title: Documentation
      regexp: '^docs(\([^)]*\))?!?:'
      order: 3
    - title: Refactoring
      regexp: '^refactor(\([^)]*\))?!?:'
      order: 4
    - title: Tests
      regexp: '^test(\([^)]*\))?!?:'
      order: 5
    - title: Build
      regexp: '^build(\([^)]*\))?!?:'
      order: 6
    - title: CI
      regexp: '^ci(\([^)]*\))?!?:'
      order: 7
    - title: Other
      order: 8

release:
  draft: false
  prerelease: auto
  replace_existing_artifacts: true
